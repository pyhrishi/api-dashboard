name: CI

# The same "green bar" CLAUDE.md requires locally, enforced on every push and PR:
# tsc clean -> lint at 0 -> unit tests -> production build -> Playwright golden path.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: Type-check / Lint / Unit / Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Type-check (0 errors)
        run: npx tsc --noEmit
      - name: Lint (0 errors, 0 warnings)
        run: npx next lint --max-warnings 0
      - name: Unit tests
        run: npm test -- --ci
      - name: Production build
        run: npx next build --no-lint
        env:
          NEXT_TELEMETRY_DISABLED: 1

  e2e:
    name: Playwright e2e
    needs: gate
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install
        run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run e2e
        run: npm run test:e2e
        env:
          CI: true
          NEXT_TELEMETRY_DISABLED: 1
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report
            test-results
          retention-days: 7
